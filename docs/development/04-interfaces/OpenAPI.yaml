components:
  schemas:
    AuthProfileResponse:
      properties:
        actor_id:
          type: string
          format: uuid
          title: Actor Id
        username:
          type: string
          title: Username
        display_name:
          type: string
          title: Display Name
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        organization_name:
          type: string
          title: Organization Name
        roles:
          items:
            type: string
          type: array
          title: Roles
        permissions:
          items:
            type: string
          type: array
          title: Permissions
        must_change_password:
          type: boolean
          title: Must Change Password
      type: object
      required:
      - actor_id
      - username
      - display_name
      - organization_id
      - organization_name
      - roles
      - permissions
      - must_change_password
      title: AuthProfileResponse
    Body_addDocumentVersion:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        role:
          type: string
          enum:
          - primary_contract
          - attachment
          - customer_contract
          title: Role
      type: object
      required:
      - file
      - role
      title: Body_addDocumentVersion
    Body_upload_knowledge_api_v1_knowledge_documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        kind:
          type: string
          enum:
          - legal
          - company
          title: Kind
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
        source_url:
          type: string
          maxLength: 2000
          title: Source Url
          default: ''
        issuer:
          type: string
          maxLength: 255
          title: Issuer
          default: ''
        scope:
          type: string
          maxLength: 1000
          title: Scope
          default: ''
        effective_from:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective From
        effective_until:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective Until
        source_key:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Key
      type: object
      required:
      - file
      - kind
      - title
      title: Body_upload_knowledge_api_v1_knowledge_documents_post
    CaseDocumentResponse:
      properties:
        document_version_id:
          type: string
          format: uuid
          title: Document Version Id
        case_id:
          type: string
          format: uuid
          title: Case Id
        file_name:
          type: string
          title: File Name
        role:
          type: string
          enum:
          - primary_contract
          - attachment
          - customer_contract
          title: Role
        media_type:
          type: string
          title: Media Type
        size_bytes:
          type: integer
          title: Size Bytes
        content_hash:
          type: string
          title: Content Hash
        parse_status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - needs_material
          - failed
          title: Parse Status
        parse_error_code:
          anyOf:
          - type: string
            enum:
            - document_size_invalid
            - pdf_signature_invalid
            - docx_signature_invalid
            - docx_structure_invalid
            - docx_expanded_size_invalid
            - docx_macro_forbidden
            - docx_archive_invalid
            - media_type_unsupported
            - docx_render_source_hash_mismatch
            - pdf_encrypted
            - pdf_parse_failed
            - pdf_has_no_pages
            - ocr_page_too_large
            - ocr_coordinates_invalid
            - ocr_image_invalid
            - ocr_unavailable
            - ocr_timeout
            - ocr_failed
            - ocr_output_too_large
            - ocr_output_invalid
            - docx_parse_failed
            - docx_renderer_unavailable
            - docx_renderer_version_unavailable
            - docx_renderer_version_unexpected
            - docx_renderer_environment_invalid
            - docx_renderer_timeout
            - docx_renderer_failed
            - docx_renderer_output_missing
            - docx_renderer_output_invalid
            - parse_storage_mismatch
            - parse_processing_error
          - type: 'null'
          title: Parse Error Code
        parser_version:
          type: string
          title: Parser Version
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        case_version:
          type: integer
          title: Case Version
        document_status:
          type: string
          enum:
          - staged
          - active
          - superseded
          - revoked
          title: Document Status
        index_status:
          type: string
          enum:
          - missing
          - queued
          - running
