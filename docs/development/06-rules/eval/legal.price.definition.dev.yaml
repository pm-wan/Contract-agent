suite_id: legal.price.definition.dev
version: 1.0.0
rule_ref: legal.price.definition@1.0.0
status: approved_for_development
notes: 开发阶段回归套件；案例和观察值是人工编制的合成工程样例，不是实时 Worker 输出或生产金标，不用于批准漏报率或误报率。这里的 human_task 分类是评测标签，不等于当前 API 任务类型；运行时统一使用 price_review 任务，TaskResult judgment 仍为 undetermined。
cases:
